name: Auto Convert & Push Mihomo Ruleset

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 时间 00:00 自动执行

# 必须要赋予 Action 写入代码仓库的权限
permissions:
  contents: write

jobs:
  build-and-convert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Create rules directory
        run: mkdir -p rules # 确保 rules 文件夹存在

      - name: Download and Convert to Domain YAML
        run: |
          cat << 'EOF' > convert.py
          import urllib.request
          
          url = "https://ruleset.skk.moe/Clash/non_ip/reject-no-drop.txt"
          
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'})
          with urllib.request.urlopen(req) as response:
              lines = response.read().decode('utf-8').splitlines()
          
          domains = []
          for line in lines:
              line = line.strip()
              if not line or line.startswith('#'):
                  continue
                  
              parts = line.split(',')
              if len(parts) >= 2:
                  rule_type = parts[0].upper()
                  value = parts[1]
                  
                  # 放弃 KEYWORD 等无法转换为 domain 的类型
                  if rule_type == 'DOMAIN':
                      domains.append(value)
                  elif rule_type == 'DOMAIN-SUFFIX':
                      domains.append(f"+.{value}")
                  elif rule_type == 'DOMAIN-WILDCARD':
                      domains.append(value)
          
          # 直接写入到 rules 文件夹下
          with open('rules/reject-no-drop.yaml', 'w', encoding='utf-8') as f:
              f.write("payload:\n")
              for domain in domains:
                  f.write(f"  - '{domain}'\n")
          
          print(f"✅ 成功将 {len(domains)} 条规则转换为 YAML 格式并保存到 rules/！")
          EOF
          
          python convert.py

      - name: Download and Convert Custom Rules to Xray Format
        run: |
            cat << 'EOF' > convert_xray.py
            import re
            import urllib.request

            sources = {
              'custom_direct': 'https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/refs/heads/main/rule/Custom_Direct.list',
              'custom_direct_ip': 'https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/refs/heads/main/rule/Custom_Direct_Classical_IP.yaml',
              'game_domain': 'https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/refs/heads/main/rule/Game_Download_CDN_Domain.yaml',
              'game_ip': 'https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/refs/heads/main/rule/Game_Download_CDN_IP.yaml',
            }
            headers = {'User-Agent': 'Mozilla/5.0'}
            rules = []
            seen = set()
            skipped = 0

            def add_rule(rule):
              if rule not in seen:
                seen.add(rule)
                rules.append(rule)

            def add_ip_rule(value):
              if value.startswith('IP-CIDR,'):
                value = value.split(',', 1)[1].split(',', 1)[0]
              prefix = 'CIDR' if '/' in value else 'ip'
              add_rule(f'{prefix}:{value}')

            def fetch(name):
              request = urllib.request.Request(sources[name], headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                return response.read().decode('utf-8').splitlines()

            for line in fetch('custom_direct'):
              line = line.strip()
              if not line or line.startswith('#'):
                continue
              parts = [part.strip() for part in line.split(',')]
              rule_type = parts[0].upper()
              if len(parts) < 2:
                continue
              value = parts[1]
              if rule_type == 'DOMAIN-SUFFIX':
                add_rule(f'domain:{value}')
              elif rule_type == 'DOMAIN':
                add_rule(f'full:{value}')
              elif rule_type == 'DOMAIN-KEYWORD':
                add_rule(f'keyword:{value}')
              elif rule_type == 'IP-CIDR':
                add_ip_rule(value)
              elif rule_type in ('DST-PORT', 'SRC-PORT'):
                skipped += 1

            for name in ('custom_direct_ip', 'game_ip'):
              for line in fetch(name):
                match = re.match(r'^\s*-\s*[\'\"]?([^\'\"\s]+)', line)
                if match and ('/' in match.group(1) or re.match(r'^\d+\.\d+\.\d+\.\d+$', match.group(1))):
                  add_ip_rule(match.group(1))

            for name in ('game_domain',):
              for line in fetch(name):
                match = re.match(r'^\s*-\s*[\'\"]([^\'\"]+)[\'\"]', line)
                if not match:
                  continue
                value = match.group(1)
                if value.startswith('+.'):
                  add_rule(f'domain:{value[2:]}')
                elif value:
                  add_rule(f'full:{value}')

            with open('rules/direct.yaml', encoding='utf-8') as source:
              for line in source:
                match = re.match(r'^\s*-\s*[\'\"]([^\'\"]+)[\'\"]', line)
                if not match:
                  continue
                value = match.group(1)
                if value.startswith('+.'):
                  add_rule(f'domain:{value[2:]}')
                elif value:
                  add_rule(f'full:{value}')

            for rule in (
              'GEOSITE,private',
              'GEOIP,private',
              'GEOSITE,google-cn',
              'GEOSITE,category-games@cn',
              'GEOSITE,category-public-tracker',
            ):
              rule_type, value = rule.split(',', 1)
              add_rule(f'{rule_type.lower()}:{value}')

            def write_rules(path, selected_rules, marker):
              with open(path, 'w', encoding='utf-8') as output:
                output.write('# Generated from Aethersailor Custom_OpenClash_Rules\n')
                output.write('# Xray routing rule format\n')
                output.write(f'{marker}\n')
                for rule in selected_rules:
                  output.write(f'{rule}\n')

            ip_rules = [rule for rule in rules if rule.startswith(('geoip:', 'ip:', 'CIDR:'))]
            domain_rules = [rule for rule in rules if not rule.startswith(('geoip:', 'ip:', 'CIDR:'))]
            ip_rules.sort(key=lambda rule: 0 if rule.startswith('geoip:') else 1)
            domain_rules.sort(key=lambda rule: 0 if rule.startswith('geosite:') else 1)
            write_rules('rules/custom_direct_ip.list', ip_rules, '#ip')
            write_rules('rules/custom_direct_domain.list', domain_rules, '#site')

            print(f'Converted {len(ip_rules)} IP rules and {len(domain_rules)} domain/site rules; skipped {skipped} port rules.')
            EOF

            python convert_xray.py

      - name: Download and Convert Custom Proxy Rules to Xray Format
        run: |
            cat << 'EOF' > convert_proxy_xray.py
            import re
            import urllib.request

            sources = (
              'https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/refs/heads/main/rule/Custom_Proxy_Classical_IP.yaml',
              'https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/refs/heads/main/rule/Custom_Proxy_Domain.yaml',
            )
            headers = {'User-Agent': 'Mozilla/5.0'}
            rules = []
            seen = set()

            def add_rule(rule):
              if rule not in seen:
                seen.add(rule)
                rules.append(rule)

            def add_ip_rule(value):
              if value.startswith('IP-CIDR,'):
                value = value.split(',', 1)[1].split(',', 1)[0]
              prefix = 'CIDR' if '/' in value else 'ip'
              add_rule(f'{prefix}:{value}')

            for url in sources:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                for line in response.read().decode('utf-8').splitlines():
                  match = re.match(r'^\s*-\s*[\'\"]?([^\'\"]+?)[\'\"]?\s*$', line)
                  if not match:
                    continue
                  value = match.group(1)
                  if value.startswith('IP-CIDR,'):
                    add_ip_rule(value.split(",", 1)[1].split(",", 1)[0])
                  elif value.startswith('+.'):
                    add_rule(f'domain:{value[2:]}')

            with open('rules/proxy.yaml', encoding='utf-8') as source:
              for line in source:
                match = re.match(r'^\s*-\s*[\'\"]([^\'\"]+)[\'\"]', line)
                if not match:
                  continue
                value = match.group(1)
                if value.startswith('+.'):
                  add_rule(f'domain:{value[2:]}')
                elif value:
                  add_rule(f'full:{value}')

            def write_rules(path, selected_rules, marker):
              with open(path, 'w', encoding='utf-8') as output:
                output.write('# Generated from Aethersailor Custom_OpenClash_Rules\n')
                output.write('# Xray routing rule format\n')
                output.write(f'{marker}\n')
                for rule in selected_rules:
                  output.write(f'{rule}\n')

            ip_rules = [rule for rule in rules if rule.startswith(('geoip:', 'ip:', 'CIDR:'))]
            domain_rules = [rule for rule in rules if not rule.startswith(('geoip:', 'ip:', 'CIDR:'))]
            ip_rules.sort(key=lambda rule: 0 if rule.startswith('geoip:') else 1)
            domain_rules.sort(key=lambda rule: 0 if rule.startswith('geosite:') else 1)
            write_rules('rules/custom_proxy_ip.list', ip_rules, '#ip')
            write_rules('rules/custom_proxy_domain.list', domain_rules, '#site')

            print(f'Converted {len(ip_rules)} IP rules and {len(domain_rules)} domain/site rules.')
            EOF

            python convert_proxy_xray.py

      - name: Download Mihomo Core
        run: |
          MIHOMO_VERSION=$(curl -sL "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" | jq -r .tag_name)
          echo "🚀 Using Mihomo Version: $MIHOMO_VERSION"
          
          DOWNLOAD_URL="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          wget -qO mihomo.gz "$DOWNLOAD_URL"
          gunzip mihomo.gz
          chmod +x mihomo

      - name: Compile to MRS Format
        run: |
          # 编译出的 mrs 文件同样直接存放到 rules 文件夹下
          ./mihomo convert-ruleset domain yaml rules/reject-no-drop.yaml rules/reject-no-drop.mrs
          ./mihomo convert-ruleset domain yaml rules/direct.yaml rules/direct.mrs
          ./mihomo convert-ruleset domain yaml rules/proxy.yaml rules/proxy.mrs
          echo "✅ MRS 编译完成！"

      - name: Commit and Push to Repository
        run: |
          # 设置 Action 机器人为提交者信息
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # 追踪 rules 文件夹下的改动
          git add rules/reject-no-drop.yaml
          git add rules/reject-no-drop.mrs
          git add rules/direct.mrs
          git add rules/proxy.mrs
          git add rules/custom_direct_ip.list
          git add rules/custom_direct_domain.list
          git add rules/custom_proxy_ip.list
          git add rules/custom_proxy_domain.list
          
          # 检查文件是否有发生变化，没有变化则跳过提交以避免 Action 报错
          if git diff --staged --quiet; then
            echo "✅ 在线规则内容未发生变化，无需提交"
          else
            # 使用 [skip ci] 防止触发不必要的其他 Actions 循环
            git commit -m "Auto Update Mihomo Rules: $(date '+%Y-%m-%d %H:%M:%S') [skip ci]"
            git push
            echo "✅ 成功提交并推送到仓库的 rules 文件夹！"
          fi
